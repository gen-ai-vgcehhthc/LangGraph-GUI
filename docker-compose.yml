services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./frontend/src/:/app/src/
      # Anonymous volume keeps the image's installed node_modules (with vite),
      # instead of shadowing them with an empty/incomplete host directory.
      - /app/node_modules
      - ./frontend/.svelte-kit/:/app/.svelte-kit/
    networks:
      - app-network
    command: npm run dev

  backend:
    build:
      context: ./backend
    # Reached by the frontend over the internal network (backend:5000) and
    # proxied to the browser via /backend, so no public host port is needed.
    # Bound to loopback only for local debugging.
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/src/:/app/src/
    environment:
      - BACKEND_PORT=5000
      - OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - app-network
    depends_on:
      - ollama

  ollama:
    build:
      context: ./ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama/.ollama/:/root/.ollama/
    networks:
      - app-network
    # GPU support is optional — remove the 'deploy' block if you don't have
    # an NVIDIA GPU or nvidia-container-toolkit installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  app-network:
    driver: bridge
