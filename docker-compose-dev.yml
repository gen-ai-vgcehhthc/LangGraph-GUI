# Local development compose — OpenAI only, no GPU, no Nginx.
# Usage: docker compose -f docker-compose-dev.yml up --build
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:5000
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    networks:
      - dev-net
    command: npm run dev

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
    environment:
      - BACKEND_PORT=5000
    networks:
      - dev-net

networks:
  dev-net:
    driver: bridge
