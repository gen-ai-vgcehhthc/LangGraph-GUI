# Local development compose — works on Windows without GPU or Nginx.
# Usage: docker compose -f docker-compose-dev.yml up --build
#
# Frontend: http://localhost:3000  (Vite HMR dev server)
# Backend:  http://localhost:5000
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      # live-reload: mount source into the container
      - ./frontend/src:/app/src
      # keep node_modules from the image (don't overwrite with host)
      - /app/node_modules
    networks:
      - dev-net
    # Override the production CMD with the Vite dev server
    command: npm run dev

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
    environment:
      - BACKEND_PORT=5000
      # host.docker.internal resolves to the Windows host from inside a Docker container.
      # This lets the backend reach a natively-installed Ollama (http://localhost:11434 on Windows).
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - dev-net

networks:
  dev-net:
    driver: bridge
